name: Live Kilimall delta (hosted runners)

# Kilimall's storefront allows off-peak, rate-limited access (robots.txt allows the
# sitemap + /listing/*, disallows /api/*) — unlike Jiji, GitHub-hosted runners are fine.
# robots-compliant always: one worker, 3–8s delays, <=60 pages per run, never /api/*.
#
# Flash sales: do NOT add sub-5-minute schedules (cron granularity + politeness).
# Use "Run workflow" (workflow_dispatch) instead — the delta only pulls changed/unseen
# listings (plus the stalest-known ones get re-checked), so a one-shot refresh right
# after a sale starts is exact and cheap.

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Max listings to collect this run (polite cap)'
        required: false
        default: '15'
  schedule:
    # 08:00, 11:00, 14:00, 17:00, 20:00, 23:00 EAT (Africa/Nairobi, UTC+3)
    - cron: "0 5,8,11,14,17,20 * * *"

permissions:
  contents: write

concurrency:
  group: kilimall-live
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install blake3 duckdb

      - name: Restore sitemap index + DB cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: kilimall-data-v1-${{ github.run_id }}
          restore-keys: kilimall-data-v1-

      - name: Seed DB from rolling release (first run only)
        run: |
          mkdir -p data
          if [ ! -f data/kilimall.db ]; then
            if curl -fsSL -o data/kilimall.db.zip "https://github.com/${{ github.repository }}/releases/download/live-latest/kilimall.db.zip"; then
              python -c "import zipfile; zipfile.ZipFile('data/kilimall.db.zip').extractall('data')" && rm data/kilimall.db.zip
              echo "seeded from rolling release"
            else
              echo "::warning::No rolling-release DB found — this run bootstraps an empty archive (expected only on first ever run)"
            fi
          fi

      - name: Refresh sitemap index if missing (first run only)
        run: |
          mkdir -p data
          if [ ! -f data/url_index.tsv ]; then python scripts/kilimall_sitemap.py; fi

      - name: Weekly sitemap refresh (Mondays)
        # lastmod drifts daily; skip-downloads cached shards, re-parses only.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            echo "Monday slot: re-syncing sitemap index (skip cached shards)"
            python scripts/kilimall_sitemap.py
          else
            echo "not Monday — sitemap refresh skipped"
          fi

      - name: Collect delta (changed/unseen + stalest known)
        env:
          MAX_ITEMS: ${{ inputs.max_items || '60' }}
        run: python scripts/kilimall_incremental.py --mode delta --max-items "$MAX_ITEMS" --refresh-oldest 15

      - name: Mark dead listings (14d stale)
        run: python scripts/data_quality.py --days 14 || true

      - name: Views-free risk heuristic
        run: python scripts/listing_risk.py || true

      - name: Run summary
        if: always()
        run: |
          python - <<'PY'
          import os, sqlite3
          path = os.environ.get('GITHUB_STEP_SUMMARY', '/tmp/summary.md')
          if not os.path.exists('data/kilimall.db'):
              open(path, 'a').write('## Live delta\n\nDB missing\n')
              raise SystemExit(0)
          c = sqlite3.connect('data/kilimall.db')
          n = c.execute('select count(*) from listings').fetchone()[0]
          pr = c.execute('select count(price) from listings where price is not null').fetchone()[0]
          gone = c.execute('select count(*) from listings where died_at is not null').fetchone()[0]
          run = c.execute('select new, changed from runs order by id desc limit 1').fetchone()
          with open(path, 'a') as f:
              f.write('## Live delta\n\n')
              f.write(f'- listings: {n} (priced: {pr}, marked died: {gone})\n')
              f.write(f'- last run new/changed: {run[0]}/{run[1]}\n')
          PY

      - name: Robots policy check (1st of month)
        run: |
          if [ "$(date -u +%d)" = "01" ]; then python scripts/robots_check.py; else echo "not 1st — skipped"; fi

      - name: Package and publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -s data/kilimall.db ] || { echo "[guard] DB missing — refusing to publish an empty snapshot"; exit 1; }
          rows=$(python -c "import sqlite3; print(sqlite3.connect('data/kilimall.db').execute('select count(*) from listings').fetchone()[0])")
          [ "$rows" -ge 1 ] || { echo "[guard] DB has 0 rows — refusing to publish"; exit 1; }
          mkdir -p data/cold
          python - <<'PY'
          import os, sqlite3
          live, cold = 'data/kilimall.db', 'data/cold/kilimall.db'
          s = sqlite3.connect(live); d = sqlite3.connect(cold)
          s.backup(d); d.execute("PRAGMA wal_checkpoint(TRUNCATE)"); d.close(); s.close()
          PY
          (cd data/cold && python -c "import zipfile; zipfile.ZipFile('../kilimall.db.zip','w',zipfile.ZIP_DEFLATED).write('kilimall.db')")
          snap="data/snapshot-$(date +%F).parquet"
          if [ -f "$snap" ]; then cp "$snap" data/kilimall-live-latest.parquet; fi
          (cd data && sha256sum kilimall.db.zip kilimall-live-latest.parquet | sed 's/ .*\///' > SHA256SUMS)
          if gh release view live-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then :; else
            gh release create live-latest --repo "$GITHUB_REPOSITORY" --title 'Live dataset (rolling)' --prerelease \
              --notes 'Rolling live delta collected on GitHub-hosted runners (robots-compliant: sitemap + /listing JSON-LD only).'
          fi
          gh release upload live-latest data/kilimall.db.zip data/kilimall-live-latest.parquet data/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      - name: Monthly immutable rollup (1st of month)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            tag="v$(date -u +%Y-%m-%d)"
            echo "creating immutable rollup $tag"
            gh release create "$tag" data/kilimall.db.zip data/kilimall-live-latest.parquet data/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --title "Frozen rollup $tag" \
              --notes "Immutable monthly rollup of the rolling live dataset."
          else
            echo "not 1st — rollup skipped"
          fi

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: kilimall-data-v1-${{ github.run_id }}
