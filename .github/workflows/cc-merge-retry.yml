name: CC merge watchdog (auto-finish a drain)

# Safety net for `CC body drain`: if its own merge job failed or was skipped,
# this finds the newest finished drain run (success OR failure — a run with a
# few failed legs still has good artifacts; cancelled runs are ignored) that has
# no `cc-merge-done-<runId>` tag, and merges/publishes it with the same script.
# Artifacts persist 7 days.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Drain run to merge (blank = newest unmerged)"
        required: false
        default: ""
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: kilimall-live
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Find drain run to merge
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.run_id }}
        run: |
          set -e
          tags=$(git ls-remote --tags origin 'cc-merge-done-*' | sed -E 's#.*/cc-merge-done-([0-9]+).*#\1#' | sort -u)
          if [ -n "$WANT" ]; then rid="$WANT"; else
            rid=""
            for id in $(gh run list --workflow cc-drain.yml --repo "$GITHUB_REPOSITORY" --limit 10 \
                  --json databaseId,status,conclusion \
                  --jq '.[] | select(.status == "completed" and (.conclusion == "success" or .conclusion == "failure")) | .databaseId'); do
              if ! grep -qx "$id" <<<"$tags"; then rid="$id"; break; fi
              break   # newest finished run already merged -> nothing to do
            done
          fi
          [ -n "$rid" ] && echo "target drain run: $rid" || echo "nothing to merge"
          echo "run_id=$rid" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.target.outputs.run_id != ''
        with:
          python-version: '3.12'
      - if: steps.target.outputs.run_id != ''
        run: pip install requests duckdb blake3

      - name: Merge all parts, publish, tag
        if: steps.target.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci_merge_run.sh "${{ steps.target.outputs.run_id }}"
