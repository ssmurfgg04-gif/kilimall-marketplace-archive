name: CC merge watchdog (auto-finish a drain)

# Closes the loop when a `CC body drain` run completes (artifacts persist 7 days):
# download part DBs -> merge into the main DB -> backfill categories -> re-publish
# enriched live-latest. Idempotent: a git tag `cc-merge-done-<runId>` marks success.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: cc-merge-watchdog
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests duckdb blake3

      - name: Find latest completed drain run without a done-tag
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rid=$(gh run list --workflow cc-drain.yml --repo "$GITHUB_REPOSITORY" --limit 5 \
                --json databaseId,status,createdAt --jq '[.[] | select(.status == "completed")] | .[0].databaseId // ""')
          if [ -z "$rid" ]; then echo "no completed drain run yet — nothing to do"; echo "run_id=" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git ls-remote --tags origin | grep -q "cc-merge-done-$rid\$"; then
            echo "run $rid already merged — nothing to do"; echo "run_id=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "target drain run: $rid"
          echo "run_id=$rid" >> "$GITHUB_OUTPUT"

      - name: Download part DBs from the drain run
        if: steps.target.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/warc-parts
          gh run download "${{ steps.target.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" \
            --pattern "warc-part-*" --dir /tmp/warc-parts
          n=$(find /tmp/warc-parts -name '*.db' | wc -l)
          echo "downloaded $n part DBs"
          [ "$n" -ge 1 ] || { echo "no part DBs — aborting"; exit 1; }
          total=$(python - <<'PY2'
          import glob, sqlite3, sys
          t = 0
          for f in glob.glob('/tmp/warc-parts/**/*.db', recursive=True):
              try:
                  t += sqlite3.connect(f).execute('select count(*) from warc_item').fetchone()[0]
              except Exception as e:
                  print('bad part db', f, e, file=sys.stderr)
          print(t)
          PY2
          )
          echo "total warc_item rows across part DBs: $total"
          if [ "$total" -ge 1 ]; then echo "has_data=true" >> "$GITHUB_ENV"; else echo "has_data=false" >> "$GITHUB_ENV"; echo "0 rows fetched across ALL part DBs — refusing to tag done; will retry after a re-dispatch"; fi

      - name: Seed DB from rolling release
        if: steps.target.outputs.run_id != '' && env.has_data == 'true'
        run: |
          mkdir -p data
          if curl -fsSL -o data/kilimall.db.zip "https://github.com/${{ github.repository }}/releases/download/live-latest/kilimall.db.zip"; then
            python -c "import zipfile; zipfile.ZipFile('data/kilimall.db.zip').extractall('data')" && rm data/kilimall.db.zip
            echo "seeded from rolling release"
          else
            echo "no prior DB — merge creates schema"
          fi

      - name: Merge parts and backfill categories
        if: steps.target.outputs.run_id != '' && env.has_data == 'true'
        run: |
          python scripts/warc_merge.py --part-dir /tmp/warc-parts
          python scripts/backfill_categories.py

      - name: Publish enriched live-latest release
        if: steps.target.outputs.run_id != '' && env.has_data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -s data/kilimall.db ] || { echo "[guard] DB missing"; exit 1; }
          n=$(python -c "import sqlite3; print(sqlite3.connect('data/kilimall.db').execute('select count(*) from warc_item').fetchone()[0])")
          echo "warc_item rows after merge: $n"
          mkdir -p data/cold
          python - <<'PY'
          import os, sqlite3
          live, cold = 'data/kilimall.db', 'data/cold/kilimall.db'
          s = sqlite3.connect(live); d = sqlite3.connect(cold)
          s.backup(d); d.execute("PRAGMA wal_checkpoint(TRUNCATE)"); d.close(); s.close()
          PY
          (cd data/cold && python -c "import zipfile; zipfile.ZipFile('../kilimall.db.zip','w',zipfile.ZIP_DEFLATED).write('kilimall.db')")
          snap="data/snapshot-$(date +%F).parquet"
          [ -f "$snap" ] || python -c "import duckdb,sys; duckdb.sql(\"copy (select * from sqlite_scan('data/kilimall.db','listings')) to 'data/kilimall-live-latest.parquet' (format parquet)\")"
          cp "$snap" data/kilimall-live-latest.parquet 2>/dev/null || true
          (cd data && sha256sum kilimall.db.zip kilimall-live-latest.parquet 2>/dev/null | sed 's/ .*\///' > SHA256SUMS || true)
          gh release upload live-latest data/kilimall.db.zip kilimall-live-latest.parquet SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      - name: Tag merge done
        if: steps.target.outputs.run_id != '' && env.has_data == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "cc-merge-done-${{ steps.target.outputs.run_id }}" -m "Merged CC harvest: auto-finish for drain run ${{ steps.target.outputs.run_id }}"
          git push origin "cc-merge-done-${{ steps.target.outputs.run_id }}"
