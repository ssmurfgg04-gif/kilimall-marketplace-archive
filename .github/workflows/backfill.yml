name: Deep backfill sweep (manual, 20 legs)

# One-time/on demand FULL catalog harvest. 20 legs, hash-sharded; each leg
# grabs its slice of the sitemap index, unseen SKUs first, stale last.
# robots-compliant always (never /api/*). ~1 worker/leg, 3–8s delays.
# ~15–20K pages per leg → ~300K+ pages per dispatch, several hours.
# Manual trigger only. Merge job publishes afterwards (tags cc-merge-done-*).

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Max pages per leg (default 2000; ~40K pages/dispatch)"
        required: false
        default: "2000"
      legs:
        description: "Parallel live legs (default 20)"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: kilimall-live
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      live: ${{ steps.m.outputs.live }}
    steps:
      - id: m
        run: echo "live=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1] or 20)))))" "${{ inputs.legs }}")" >> "$GITHUB_OUTPUT"

  drain:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        leg: ${{ fromJson(needs.setup.outputs.live) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install blake3 duckdb requests

      - name: Seed DB from rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci_seed.sh
      - name: Build sitemap index if missing
        run: '[ -f data/url_index.tsv ] || python scripts/kilimall_sitemap.py'
      - name: Mark leg start
        run: |
          python -c "import sqlite3,datetime; d=sqlite3.connect('data/kilimall.db'); d.execute('create table if not exists leg_meta(started_at TEXT)'); d.execute('insert into leg_meta values(?)',(datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),)); d.commit()"
      - name: Sweep leg
        env:
          MAX_ITEMS: ${{ inputs.max_items || '2000' }}
        run: |
          python scripts/kilimall_incremental.py --mode all \
            --shard ${{ matrix.leg }} --shards ${{ inputs.legs || '20' }} \
            --max-items "$MAX_ITEMS" --dmin 1 --dmax 3 --deadline-min 320 --no-snapshot
      - name: Publish live part DB to cc-parts release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -9 -c data/kilimall.db > "/tmp/live-part-${{ matrix.leg }}.db.gz"
          gh release upload cc-parts "/tmp/live-part-${{ matrix.leg }}.db.gz" --clobber --repo "$GITHUB_REPOSITORY"
  merge:
    needs: drain
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests duckdb blake3
      - name: Merge parts and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci_merge_run.sh "$GITHUB_RUN_ID"
